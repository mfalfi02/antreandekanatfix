<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Offline - Antrean Dekanat</title>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 10% 0%, rgba(37, 99, 235, .18), transparent 30%),
                linear-gradient(180deg, #eef5ff 0%, #f8fbff 100%);
            color: #0f172a;
        }

        .card {
            width: min(92vw, 420px);
            padding: 28px;
            border-radius: 22px;
            background: rgba(255, 255, 255, .92);
            border: 1px solid #dbe6f6;
            box-shadow: 0 18px 40px -28px rgba(15, 23, 42, .35);
            text-align: center;
        }

        img {
            width: 88px;
            height: 88px;
            object-fit: contain;
            display: block;
            margin: 0 auto 16px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.35rem;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/logosistem.jpeg" alt="Logo Sistem">
        <h1>Anda sedang offline</h1>
        <p>Halaman ini membutuhkan koneksi internet untuk memuat data antrean dan dashboard terbaru.</p>
    </div>
</body>
</html>
